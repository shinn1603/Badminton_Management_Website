<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Thực OTP Đăng Ký - UTE Badminton Club</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 30%, rgba(6, 78, 59, 0.95) 0%, rgba(4, 20, 16, 0.98) 100%),
                  url('/images/badminton_arena_hero.jpg') center/cover no-repeat fixed;
      background-blend-mode: overlay;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
    }

    .otp-card {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    [data-theme="dark"] .otp-card {
      background: rgba(15, 30, 26, 0.94);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .otp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .otp-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-dark, #0f172a);
      margin: 0 0 8px;
    }

    .otp-sub {
      font-size: 13px;
      color: var(--text-muted, #64748b);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .otp-input {
      width: 100%;
      height: 54px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 10px;
      text-align: center;
      border-radius: 12px;
      border: 2px solid rgba(16, 185, 129, 0.4);
      background: var(--surface, #ffffff);
      color: #047857;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 18px;
      transition: all 0.2s ease;
    }

    .otp-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
    }

    .AlertBox {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="otp-card">
    <div class="otp-badge">📩 Xác thực Email</div>
    <h1 class="otp-title">Nhập Mã Xác Thực OTP</h1>
    <p class="otp-sub">
      Hệ thống đã gửi mã gồm 6 chữ số đến email:<br>
      <strong id="targetEmailText" style="color: #10b981;">---</strong>
    </p>

    <div id="otpAlertBox" class="AlertBox"></div>

    <form id="verifyOtpForm" onsubmit="handleVerifyOtpSubmit(event)">
      <input type="text" id="otpCodeInput" class="otp-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">

      <button type="submit" id="btnVerifyOtp" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 14px; font-weight: 700; border-radius: 12px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none; color: #ffffff; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);">
        Xác Nhận & Đăng Nhập Ngay
      </button>
    </form>

    <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px;">
      <a href="/customer/auth?tab=register" style="color: var(--text-muted, #64748b); text-decoration: none; font-weight: 600;">
        ← Quay lại đăng ký
      </a>
      <a href="javascript:void(0)" id="btnResendOtp" onclick="resendRegisterOtp()" style="color: #10b981; text-decoration: none; font-weight: 700;">
        Gửi lại mã OTP
      </a>
    </div>
  </div>

  <script>
    const pendingEmail = sessionStorage.getItem('utesport_pending_email');
    const maskedEmail = sessionStorage.getItem('utesport_pending_masked_email');

    document.addEventListener('DOMContentLoaded', () => {
      if (!pendingEmail) {
        window.location.href = '/customer/auth?tab=register';
        return;
      }
      document.getElementById('targetEmailText').textContent = maskedEmail || pendingEmail;
    });

    function showOtpAlert(message, isSuccess = false) {
      const box = document.getElementById('otpAlertBox');
      box.style.display = 'block';
      if (isSuccess) {
        box.style.background = 'rgba(16, 185, 129, 0.12)';
        box.style.border = '1px solid rgba(16, 185, 129, 0.35)';
        box.style.color = '#10b981';
        box.innerHTML = `✔ ${message}`;
      } else {
        box.style.background = 'rgba(239, 68, 68, 0.12)';
        box.style.border = '1px solid rgba(239, 68, 68, 0.35)';
        box.style.color = '#ef4444';
        box.innerHTML = `✖ ${message}`;
      }
    }

    async function handleVerifyOtpSubmit(e) {
      e.preventDefault();
      const otp = document.getElementById('otpCodeInput').value.trim();
      const btn = document.getElementById('btnVerifyOtp');

      if (!otp || otp.length < 6) {
        showOtpAlert('Vui lòng nhập đủ 6 chữ số OTP!', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang xác thực & khởi tạo tài khoản...';

      try {
        const res = await fetch('/api/auth/verify-register-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, otp: otp })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // 1. Lưu trạng thái đăng nhập giống hệt login.html và auth.html
          localStorage.setItem('utesport_user', JSON.stringify(data));
          if (data.token) {
            localStorage.setItem('jwt_token', data.token);
            document.cookie = `jwt_token=${data.token}; path=/; max-age=86400`;
          }

          // 2. Xóa session đăng ký tạm
          sessionStorage.removeItem('utesport_pending_email');
          sessionStorage.removeItem('utesport_pending_masked_email');

          showOtpAlert('Xác thực thành công! Đang chuyển vào trang chủ...', true);

          // 3. Chuyển hướng về trang chủ khách hàng (/customer/home)
          const qParams = new URLSearchParams(window.location.search);
          const redirectParam = qParams.get('redirect');
          const targetUrl = (redirectParam && redirectParam.startsWith('/customer/')) ? redirectParam : '/customer/home';

          setTimeout(() => {
            window.location.href = targetUrl;
          }, 700);
        } else {
          showOtpAlert(data.message || 'Mã OTP không chính xác hoặc đã hết hạn!', false);
          btn.disabled = false;
          btn.textContent = 'Xác Nhận & Đăng Nhập Ngay';
        }
      } catch (err) {
        showOtpAlert('Lỗi kết nối máy chủ. Vui lòng thử lại!', false);
        btn.disabled = false;
        btn.textContent = 'Xác Nhận & Đăng Nhập Ngay';
      }
    }

    async function resendRegisterOtp() {
      const btn = document.getElementById('btnResendOtp');
      btn.textContent = 'Đang gửi lại...';
      try {
        const res = await fetch('/api/auth/resend-register-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showOtpAlert(data.message || 'Đã gửi lại mã OTP mới vào email của bạn!', true);
        } else {
          showOtpAlert(data.message || 'Không thể gửi lại OTP, vui lòng đăng ký lại!', false);
        }
      } catch (e) {
        showOtpAlert('Lỗi mạng khi gửi lại OTP!', false);
      } finally {
        btn.textContent = 'Gửi lại mã OTP';
      }
    }
  </script>
</body>
</html>
